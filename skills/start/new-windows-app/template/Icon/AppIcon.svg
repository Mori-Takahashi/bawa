<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- The app icon source. tools\make-icon.cs renders it to Icon\AppIcon.ico.
       Keep shapes bold: it must read at 16 px in the taskbar and title bar. -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82D6"/>
      <stop offset="1" stop-color="#1E5BB0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#fill)"/>
  <rect x="64" y="72" width="128" height="24" rx="12" fill="#FFFFFF"/>
  <rect x="64" y="116" width="128" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="64" y="160" width="88" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.7"/>
</svg>
